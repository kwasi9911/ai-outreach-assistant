  - {name: PJT Partners,        aliases: [PJT],                     email_domain: pjtpartners.com,   patterns: [first.last], confidence: high}
  - {name: Centerview Partners, aliases: [Centerview],              email_domain: centerview.com,    patterns: [flast], confidence: medium}
